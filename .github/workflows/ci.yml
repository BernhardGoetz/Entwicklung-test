name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck + Build
        run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tauri-Systemabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev build-essential pkg-config libssl-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # tauri::generate_context! erwartet das Frontend-Verzeichnis dist/.
      - run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Runner-Images lokal bauen
        run: |
          docker build -t code-pruefer-python:dev images/python
          docker build -t code-pruefer-java:dev images/java
      - name: Docker-Integrationstests
        working-directory: src-tauri
        run: |
          cargo test --test docker_integration -- --ignored --test-threads=1
          cargo test --test image_bundle -- --ignored --test-threads=1
