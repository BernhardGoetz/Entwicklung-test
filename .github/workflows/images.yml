name: Runner-Images

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yml"]
  pull_request:
    paths: ["images/**", ".github/workflows/images.yml"]
  workflow_dispatch:

env:
  # Muss zu IMAGE_TAG in src-tauri/src/runner/languages.rs passen.
  IMAGE_TAG: "0.1.0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, java]
    steps:
      - uses: actions/checkout@v5

      - name: Image-Namen bestimmen
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/code-pruefer-${{ matrix.language }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (und Push auf main)
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.language }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.IMAGE_TAG }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.language }}
          cache-to: type=gha,mode=max,scope=${{ matrix.language }}
