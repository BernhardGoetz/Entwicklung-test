name: Runner-Images

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yml"]
  pull_request:
    paths: ["images/**", ".github/workflows/images.yml"]
  workflow_dispatch:

# Baut die Runner-Images bei Änderungen (Kontrolle + "edge"-Tags auf main).
# Die Versions-Tags (:<version>), die die App verwendet, pusht ausschließlich
# .github/workflows/release.yml beim Versions-Tag v<version>.

permissions: {}

# Ein Lauf je Branch bzw. Pull Request; ein neuer Push bricht den laufenden
# Lauf eines Pull Requests ab, auf Branches läuft er zu Ende.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout
      packages: write # Push nach GHCR (nur außerhalb von Pull-Requests)
    strategy:
      fail-fast: false
      matrix:
        language: [python, java]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image-Namen bestimmen
        id: meta
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/code-pruefer-${LANGUAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (und Push auf main)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/${{ matrix.language }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:edge
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.language }}
          cache-to: type=gha,mode=max,scope=${{ matrix.language }}
