name: Release

# Baut zu einem Versions-Tag (v<version>, z. B. v0.2.0):
#  1. die Runner-Images multi-arch (amd64/arm64) und pusht sie nach
#     ghcr.io/<owner>/code-pruefer-<sprache>:<version> (Online-Update-Pfad);
#     manuelle Läufe (workflow_dispatch) pushen nur :sha-<commit>, damit
#     Versions-Tags ausschließlich aus Versions-Tags entstehen,
#  2. je Architektur gzip-Archive der Images (Offline, im Installer enthalten),
#     per Digest aus der Registry geholt, dazu image-digests.json mit den
#     Prüfsummen, gegen die die App Archive und Downloads prüft,
#  3. den Windows-Installer (NSIS, x64) und macOS-DMGs (Apple Silicon + Intel)
#     mit eingebetteten Images (src-tauri/tauri.release.conf.json),
#  4. ein Entwurfs-Release (draft) mit allen Installern.
# Die App erwartet <IMAGE_REGISTRY>/code-pruefer-<sprache>:<Cargo-Version>;
# der Job "version" bricht ab, wenn Tag, Cargo.toml, tauri.conf.json,
# package.json oder der Registry-Namensraum nicht zusammenpassen.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Entwurfs-Release anlegen (sonst nur Workflow-Artefakte)"
        type: boolean
        default: false

# Keine Rechte auf Workflow-Ebene; jeder Job bekommt nur, was er braucht.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      registry: ${{ steps.v.outputs.registry }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Version und Image-Referenzen prüfen
        id: v
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          tauri_version="$(jq -r .version src-tauri/tauri.conf.json)"
          npm_version="$(jq -r .version package.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
          else
            tag_version="$cargo_version"
          fi
          for v in "$tauri_version" "$npm_version" "$tag_version"; do
            if [ "$v" != "$cargo_version" ]; then
              echo "::error::Versionen passen nicht: Cargo.toml=$cargo_version tauri.conf.json=$tauri_version package.json=$npm_version Tag=$tag_version"
              exit 1
            fi
          done
          # GHCR-Namen müssen klein geschrieben sein.
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          registry="ghcr.io/$owner"
          app_registry="$(sed -n 's/^pub const IMAGE_REGISTRY: &str = "\(.*\)";$/\1/p' src-tauri/src/runner/languages.rs)"
          if [ "$registry" != "$app_registry" ]; then
            echo "::error::Die App erwartet Images unter $app_registry, der Workflow würde nach $registry pushen (IMAGE_REGISTRY in languages.rs anpassen)."
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "Images: $registry/code-pruefer-<sprache>:$cargo_version" >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout
      packages: write # Push der Images nach GHCR
    strategy:
      fail-fast: true
      matrix:
        language: [python, java]
    env:
      REPO: ${{ needs.version.outputs.registry }}/code-pruefer-${{ matrix.language }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build und Push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/${{ matrix.language }}
          platforms: linux/amd64,linux/arm64
          push: true
          # :<version> nur bei einem Versions-Tag (leere Zeilen ignoriert die Action).
          tags: |
            ${{ env.REPO }}:sha-${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('{0}:{1}', env.REPO, env.VERSION) || '' }}
          # Bewusst ohne Build-Cache (Schutz vor Cache-Poisoning).
          no-cache: true

      # Die Archive werden aus den gerade gepushten Images (per Digest)
      # erzeugt, damit Offline- und Online-Variante identische Digests haben.
      - name: Image-Archive exportieren (amd64, arm64)
        env:
          MODE: pull
          LANGUAGES: ${{ matrix.language }}
          IMAGE_REGISTRY: ${{ needs.version.outputs.registry }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          scripts/export-image-archives.sh amd64 image-archives
          scripts/export-image-archives.sh arm64 image-archives
          echo "$REPO@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.language }}
          path: image-archives/image-digests.json
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.language }}-amd64
          path: image-archives/code-pruefer-${{ matrix.language }}-amd64.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.language }}-arm64
          path: image-archives/code-pruefer-${{ matrix.language }}-arm64.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  # Release-Jobs bauen ohne npm- und Rust-Cache (Schutz vor Cache-Poisoning);
  # nur ci.yml nutzt Caches.
  bundle-windows:
    needs: images
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Image-Archive (amd64) in den Ressourcenordner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*-amd64
          merge-multiple: true
          path: src-tauri/resources/images

      - name: Prüfsummen der Images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digests-*
          path: digests

      - name: image-digests.json zusammenführen
        shell: bash
        run: jq -s 'reduce .[] as $d ({}; . * $d)' digests/*/image-digests.json > src-tauri/resources/images/image-digests.json

      - run: npm ci

      # Optional: Code-Signing (z. B. per bundle.windows.signCommand) ist
      # noch nicht eingerichtet – der Installer ist unsigniert.
      - name: Installer bauen (NSIS, deutsch, mit Images)
        shell: bash
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.release.conf.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          compression-level: 0
          if-no-files-found: error

  bundle-macos:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          # Intel-Build per Cross-Kompilierung auf dem (Apple-Silicon-)Runner.
          - name: macos-x64
            runner: macos-15
            target: x86_64-apple-darwin
            arch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # Die Apple-Secrets liegen im Environment "release" (nicht als
    # Repository-Secrets), damit nur dieser Job sie sieht; Pflicht-Reviewer
    # und Tag-Regel siehe README, Abschnitt "Sicherheit".
    environment: release
    env:
      TARGET: ${{ matrix.target }}
      # Secrets sind in `if:` nicht direkt verfügbar.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Image-Archive (${{ matrix.arch }}) in den Ressourcenordner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*-${{ matrix.arch }}
          merge-multiple: true
          path: src-tauri/resources/images

      - name: Prüfsummen der Images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digests-*
          path: digests

      - name: image-digests.json zusammenführen
        run: jq -s 'reduce .[] as $d ({}; . * $d)' digests/*/image-digests.json > src-tauri/resources/images/image-digests.json

      - run: npm ci

      - name: App und DMG bauen (unsigniert)
        if: env.HAS_APPLE_CERT != 'true'
        run: npm run tauri -- build --target "$TARGET" --bundles app,dmg --config src-tauri/tauri.release.conf.json

      # OPTIONAL – wird übersprungen, solange das Secret APPLE_CERTIFICATE
      # fehlt. Benötigte Secrets: APPLE_CERTIFICATE (base64 .p12),
      # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY und für die
      # Notarisierung APPLE_ID, APPLE_PASSWORD (app-spezifisch), APPLE_TEAM_ID.
      - name: App und DMG bauen (signiert und notarisiert)
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --target "$TARGET" --bundles app,dmg --config src-tauri/tauri.release.conf.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [version, bundle-windows, bundle-macos]
    if: github.ref_type == 'tag' || inputs.draft_release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Entwurfs-Release anlegen
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bundle-*
          merge-multiple: true
          path: release

      # Mit der vorinstallierten gh-CLI statt einer Fremd-Action, die das
      # Token mit Schreibrecht bekäme.
      - name: Entwurfs-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          REGISTRY: ${{ needs.version.outputs.registry }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Keine Installer gefunden."
            exit 1
          fi
          cat > notes.md <<EOF
          Code-Prüfer ${VERSION} (Entwurf, unsigniert)

          - Windows x64: \`*_x64-setup.exe\`
          - macOS Apple Silicon: \`*_aarch64.dmg\`, macOS Intel: \`*_x64.dmg\`

          Die Runner-Images (Python, Java) sind in den Installern enthalten und werden
          beim ersten Start automatisch in Docker bzw. Podman geladen. Online-Update:
          \`${REGISTRY}/code-pruefer-python:${VERSION}\`
          und \`${REGISTRY}/code-pruefer-java:${VERSION}\`.
          EOF
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Erneuter Lauf: nur Entwürfe dürfen überschrieben werden.
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::Release $tag ist bereits veröffentlicht."
              exit 1
            fi
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --draft \
              --target "$GITHUB_SHA" \
              --title "Code-Prüfer ${VERSION}" \
              --notes-file notes.md
          fi
