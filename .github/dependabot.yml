# Wöchentliche Update-PRs für die per Commit-SHA gepinnten Actions und die
# Abhängigkeiten von Frontend (npm) und Backend (cargo). Neue Versionen
# werden erst nach 7 Tagen vorgeschlagen (Schutz vor kompromittierten
# Releases, die meist schnell zurückgezogen werden).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
