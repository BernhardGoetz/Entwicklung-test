[package]
name = "code-pruefer"
version = "0.1.0"
description = "Code-Prüfer: Programmieraufgaben lokal in Docker-Containern testen"
authors = ["Bernhard Goetz"]
edition = "2021"
license = "MIT"

[lib]
name = "code_pruefer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bollard = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
futures-util = "0.3"
thiserror = "2"
base64 = "0.22"
